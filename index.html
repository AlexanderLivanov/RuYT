<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0077ff">
    <title>RuYT</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">

        <header class="header">
            <div class="header-title">RuYT</div>
        </header>

        <main class="content">

            <section class="search">
                <input id="search-input" class="input" type="search" placeholder="Поиск видео" autocomplete="off">

                <button id="search-button" class="button">
                    Найти
                </button>
            </section>

            <p id="search-status" class="status"></p>

            <section id="results" class="results"></section>

            <section id="player-section" class="player-section" hidden>

                <button id="back-button" class="back-button">
                    ← Назад к результатам
                </button>

                <video id="video-player" class="video-player" controls playsinline></video>

                <h1 id="video-title" class="video-title"></h1>
                <p id="video-channel" class="video-channel"></p>

            </section>

        </main>
    </div>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
