<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0077ff">
    <title>VK Mini App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <header class="header">
            <div class="header-title">Моё приложение</div>
        </header>

        <main class="content">
            <section class="hero">
                <div class="hero-icon">VK</div>
                <h1>Привет</h1>
                <p id="status">Загрузка...</p>
            </section>

            <section class="card">
                <div class="card-title">Пользователь</div>
                <div id="user-info" class="user-info">
                    Авторизация...
                </div>
            </section>

            <div class="download">
                <input id="video-url" type="url" placeholder="Ссылка на YouTube" autocomplete="off">
            
                <button id="download-button" class="button">
                    Скачать видео
                </button>
            
                <p id="download-status"></p>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
